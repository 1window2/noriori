name: noriori
description: 일본 철도 탑승 기록 앱
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.2
  go_router: ^18.1.2
  maplibre_gl: 0.27.1
  noriori_core:
    path: ../../packages/noriori_core
  noriori_store:
    path: ../../packages/noriori_store
  package_info_plus: ^10.2.2
  path_provider: 2.1.6
  share_plus: ^13.3.1
  slang: ^4.19.2
  slang_flutter: ^4.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/pack/
    - assets/fonts/LICENSE-Pretendard.txt
    - assets/fonts/LICENSE-Noto.txt
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
