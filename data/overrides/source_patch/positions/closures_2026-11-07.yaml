- {"patch": "add", "node": "n_senri_chuo_kari", "lat": 34.806763, "lon": 135.494407, "quality": "approx", "checked": "2026-11-07", "source": "n05", "why": "[北大阪急行] 北大阪急行電鉄南北線 oldid=111622054, 万国博中央口駅 oldid=110035540: 「1970年2月24日：南北線・会場線 江坂駅 - 万国博中央口駅間 (9.0 km) が開業」「9月14日：会場線 分岐点 - 万国博中央口駅間 (3.6 km) が廃止。南北線 分岐点 - 千里中央駅間 (0.5 km) が開業」「開業当時の千里中央駅は…会場線上に設けられた仮設駅」, 万国博中央口 キロ程 9.0·前の駅 千里中央 駅間 3.2. 分岐점(5.4)을 따로 두지 않고 桃山台–千里中央(仮) 1.9를 지선 계통 r_namboku_line_kita_osaka_kyuko_kaijo(江坂–万国博中央口, owned, also 江坂–桃山台)의 route_only edge로 둠: 桃山台–분기점 1.5km는 지금 edge e_010325과 겹침(edge를 쪼개지 않는 근사). 재생성으로 원본에 생기면 지움. 좌표 N05 会場線 역 점(지금 千里中央에서 약 220m)"}
