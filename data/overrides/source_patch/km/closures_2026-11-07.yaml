- {"patch": "add", "edge": "e_090119", "km": 1.1, "source": "wikipedia:111030345", "why": "[安城支線] 名鉄安城支線 oldid=111030345: 「全長1.1 km」「1951年3月21日 - 旅客営業開始。新安城駅を安城駅に改称し国鉄と共同使用駅となる」「1961年7月30日 - 廃止」, 1939-12-25 화물 개업, 1950-10-28~11-01 국체 임시 여객. 「西尾線の支線」이라 西尾線의 지선 계통으로 둠(별도 노선으로 할지는 판단). 安城은 국철과 共同使用駅이라 JR 安城 묶음 g_anjo. 재생성으로 원본에 생기면 지움"}
- {"patch": "add", "edge": "e_090117", "km": 1.9, "source": "wikipedia:110035540+111622054", "why": "[北大阪急行] 北大阪急行電鉄南北線 oldid=111622054, 万国博中央口駅 oldid=110035540: 「1970年2月24日：南北線・会場線 江坂駅 - 万国博中央口駅間 (9.0 km) が開業」「9月14日：会場線 分岐点 - 万国博中央口駅間 (3.6 km) が廃止。南北線 分岐点 - 千里中央駅間 (0.5 km) が開業」「開業当時の千里中央駅は…会場線上に設けられた仮設駅」, 万国博中央口 キロ程 9.0·前の駅 千里中央 駅間 3.2. 分岐점(5.4)을 따로 두지 않고 桃山台–千里中央(仮) 1.9를 지선 계통 r_namboku_line_kita_osaka_kyuko_kaijo(江坂–万国博中央口, owned, also 江坂–桃山台)의 route_only edge로 둠: 桃山台–분기점 1.5km는 지금 edge e_010325과 겹침(edge를 쪼개지 않는 근사). 재생성으로 원본에 생기면 지움"}
