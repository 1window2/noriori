- {"patch": "add", "edge": "e_097013", "km": 2.2, "source": "日本国有鉄道『鉄道停車場一覧 昭和41年3月1日現在』(NDL pid 1873236) コマ26", "why": "[F9 화물 東海道本線 膳所–浜大津] 国鉄 東海道本線 貨物支線 膳所–浜大津. 1966 停車場一覧(높음) 「貨」 浜大津 駅間 2.2 km. 날짜는 위키 東海道本線 oldid=111445893 年表 「貨物支線（浜大津線・1969年廃止） 膳所駅 (0.0 km) - 浜大津駅 (2.2 km) / 1913年以前は大津線。旅客営業廃止と同時に東海道本線の貨物支線に変更」(중간). 여객 영업 기간이 1950년 뒤에 없어 숨은 노선(화물 규칙 1). km는 1950 뒤 값이고 1950 전 km 바뀜은 기록 범위 밖. 국철 浜大津(화물)은 京阪·江若 浜大津와 다른 노드로 둠. 국철 여객은 1913 폐지(1950 전). 다만 1947-01-25~1965-07-10에는 江若鉄道 여객 열차가 이 화물 지선(三線軌条)에 乗り入れ했다(위키 江若鉄道 rev110542243 「1947年から1965年までの間は国鉄の貨物支線を介して膳所駅まで乗り入れていた」, 위키 京阪石山坂本線 rev107968078 1965-07-10 「江若鉄道車両の浜大津駅 - 膳所駅間乗り入れを廃止」). 그 여객 이력(1947-01-25~1965-07-10)은 법적 노선대로 東海道本線 지선 계통 膳所～浜大津(江若 浜大津 노드, 분모 밖)으로 기록하고 이 숨은 화물 칸은 화물역 浜大津까지 그대로 둔다 (10회차 G1 kinki_1-09·kinki_2-011, 11회차 R 확정 「국철 노선에 乗入」·S2)"}
