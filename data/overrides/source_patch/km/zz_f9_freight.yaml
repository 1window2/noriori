- {"patch": "add", "edge": "e_097038", "km": 2.5, "source": "日本国有鉄道『鉄道停車場一覧 昭和41年3月1日現在』(NDL pid 1873236) コマ127", "why": "[F9 화물 幸袋線 幸袋–伊岐須] 国鉄 幸袋線 貨物支線 幸袋–伊岐須. 1966 停車場一覧(높음) 「貨」 伊岐須 駅間 2.5 km. 날짜는 위키 幸袋線 oldid=106494274 年表 「1899-12-26 伊岐須分岐点 - 伊岐須間の貨物支線を開業 / 1969-12-08 小竹 - 二瀬間の全線と貨物支線（幸袋 - 伊岐須間）を廃止 / 幸袋駅 - 川津信号場 (1.6) - （貨）伊岐須駅 (2.5)」(중간). 여객 영업 기간이 1950년 뒤에 없어 숨은 노선(화물 규칙 1). km는 1950 뒤 값이고 1950 전 km 바뀜은 기록 범위 밖. 幸袋–川津信号場 1.6 km는 본선 선로를 같이 써서 분기 신호장 노드 없이 幸袋에서 잇는 칸"}
- {"patch": "add", "edge": "e_097039", "km": 0.8, "source": "日本国有鉄道 아닌 사철: 鉄道省『鉄道停車場一覧 昭和12年10月1日現在』(NDL pid 1207554) コマ169-170 (1937 값 0.0·0.8·1.4·2.5·第二會澤 3.3·第三會澤 4.4) + ja.wikipedia 東武会沢線 oldid=111432445 1981년 역 표(0.0·0.8·1.4·2.5·4.6)", "why": "[F9 화물 会沢線 葛生–第三会沢] 東武 会沢線 葛生–第三会沢, 여객 영업 기록 없는 화물선(1920-08-23~1925-08-05 人車線, 1925-08-05부터 一般貨物線; 人車軌道는 수록 밖). 1937 停車場一覧(높음) 葛生 0.0·上白石 0.8(昭和3.7.13)·築地 1.4·第一會澤 2.5·第三會澤 4.4(모두 大正9.8.23) — 第二會澤 3.3(大正14.8.5, 1938 폐지)은 1950 전이라 뺌. 1950 뒤 km는 위키 1981 표(第三会沢 4.6, 1985-12-01 4.2). 폐지 1986-10-21 上白石–第三会沢·1997-10-01 葛生–上白石(위키, 百年史 인용, 중간). 1950 전 회사·km 바뀜은 기록 범위 밖 / 결정(사용자 2026-11-19): 개업은 人車 시기를 빼고 1925-08-05(一般貨物線). 上白石–第三会沢 1986-10-21·葛生–上白石 1997-10-01 칸별 폐지(seg_dates). 第三会沢 1985-12-01 4.2km 단축은 숨은 노선이라 km 바뀜을 넣지 않고 4.6 그대로 (12회차 M R6)"}
