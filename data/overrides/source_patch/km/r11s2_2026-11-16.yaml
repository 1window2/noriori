# 11회차 S2 구조 패치 (2026-11-16): 江若 乗入 膳所–浜大津을 국철 東海道本線 지선 계통으로
- {"patch": "add", "edge": "e_096401", "km": 2.2, "source": "wikipedia:110542243", "why": "[江若 乗入 膳所–浜大津] 膳所–浜大津 2.2 km는 国鉄 東海道本線 貨物支線(옛 大津線·浜大津線)의 선로이고 江若 여객 열차가 1947-01-25~1965-07-10 乗り入れ했다(江若 면허 없음, 江若 営業キロ 51.0은 浜大津 기점). 『大阪鉄道局史』(1950) 「江若鉄道膳所乘入に伴い浜大津膳所連動を変更す」, 『交通年鑑 昭和23・24年版』 「省濱大津膳所間江若鐵道線路共用に…列車乘入による營業開始」, 『京阪電気鉄道』(1991) 「浜大津-膳所間の江若鉄道の乗入れ気動車と国鉄連絡の貨物列車(この区間は本来東海道線…」(서로 독립 중간 셋), 위키 江若鉄道 rev110542243. 사용자 결정 「법적 노선에 기록」: 여객 이력 기간만 東海道本線 지선 계통으로 기록하고 분모 밖(화물·연결선 규칙). 화물 전용 기간(1880–1969)은 숨은 노선 東海道本線（貨物） 膳所–浜大津(화물역) 그대로 (11회차 S2 2026-11-16) / km: 위키 江若鉄道 「浜大津 - 膳所間2.2 km」, 1966 停車場一覧 貨物 浜大津 駅間 2.2(높음, NDL pid 1873236 コマ26)"}
