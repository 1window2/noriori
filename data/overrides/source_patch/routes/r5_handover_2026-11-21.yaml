# 5번 결정 이관 표시 (2026-11-21): 옛 자기 구간을 main 계통에 두어 기존 이관 표시로 그린다 (京津線 京津三条·石川線 白菊町 선례와 같은 방식)
- {"patch": "replace", "id": "r_tokushima_line", "line": "l_tokushima_line", "role": "main", "from": "n_awa_ikeda", "to": "n_sako", "why": "[徳島線] 徳島線 oldid=111002251: 佃–阿波池田은 1914-03-25 徳島本線으로 개통해 1962-07-18 土讃線으로 소속 변경(『官報』 인용). 계통 起点을 阿波池田으로 늘려 넘겨준 구간을 이관 구간으로 그림. 阿波池田–三縄(1931–1935 徳島本線)은 기록 하한(1950) 전이라 계통에 넣지 않음"}
