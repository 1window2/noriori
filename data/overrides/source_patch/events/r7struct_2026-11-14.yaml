# 7회차 구조 패치 (2026-11-14): 한때 역이던 신호장(三岐朝明), 和歌山線 北宇智 스위치백 옛 자리
- {"patch": "add", "date": "1896-10-25", "type": "open", "operator": "o_japanese_national_railways", "line": "l_wakayama_line", "edges": ["e_093701", "e_093702"], "source": "noritsubushi", "why": "[和歌山線 옛 北宇智 스위치백] 2007-03-18 스위치백 해소·본선 위 새 승강장(옛 자리 마지막 2007-03-17): 西日本旅客鉄道 보도자료 2007-02-19 「3月17日22時以降から18日9時まで…北宇智駅を通過」(Wayback 2007-11-05 사본, 높음), 위키 北宇智駅 r109083267 「3月18日：スイッチバック解消」(중간). km: 1966 『停車場一覧』 吉野口–北宇智 6.7·累計31.6(NDL 1873236, 높음), 위키 和歌山線 r110989741 「吉野口駅 - 北宇智駅間を6.7 kmから6.6 kmに、北宇智駅 - 五条駅間を4.2 kmから3.9 kmに改キロ」. 구조: 옛 역은 막다른 선 끝이라 옛 경로를 지금 선형 사이에 끼우면 칸 km가 어긋남 → 같은 계통의 옛 선로(alt old) 吉野口–北宇智(旧) 6.7 + 北宇智(旧)–北宇智 연결 0.3(=4.2−3.9, 되돌아 나와 분기점까지), 그 뒤 北宇智–五条 3.9는 옛·새 경로가 같이 씀(옛 五条 35.8 = 새 35.4 + 0.4). 새 칸 吉野口–北宇智 6.6은 2007-03-18부터(edge_dates). km 두 값(6.7·0.3)은 다른 조사원이 확인 중인 변수 (7회차 구조 2026-11-14; 6회차 r6out/A2). 개업은 吉野口–五条 구간 개업일(노리츠부시 표, 지금 칸과 같음)"}
