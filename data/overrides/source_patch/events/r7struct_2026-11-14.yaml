- {"patch": "add", "date": "1950-09-17", "type": "open", "operator": "o_nagoya_railroad", "line": "l_mikawa_line", "route": "r_mikawa_line_chiryu_connecting_line", "edges": ["e_093705"], "source": "hand", "why": "[名鉄 知立連絡線] 三河線 三河知立(옛 知立, 1959-04-01 개칭)–名古屋本線 知立信号所 0.8 km 단선 연결선: 1928-06-01 愛知電気鉄道 개통(『名古屋鉄道百年史』1994 연표 「知立連絡線知立分岐点～知立(三河鉄道)間0.8粁開通」, 높음; 『私鉄要覧』「知立連絡線 0.8 単」), 1984-04-01 「三河線三河知立～知立信号所間廃止」(百年史). 여객: 1950-09-17 名古屋本線–三河線 직통 시작(『鉄道ピクトリアル』1995-10 「昭和25年9月17日からは,知立信号所を介して,三河線と名古屋本線とを直通する特急」, 위키 三河線) ~ 1959-04-01 새 知立 개업·「三河線知立～三河知立間」 새 선 사용으로 직통이 새 知立을 지나게 된 날(百年史 1959 연표, 화물선 서술 — 連絡線 여객 끝을 직접 쓴 문장은 없어 정황 근거). 그 뒤는 화물선이라 기록하지 않음. 여객 영업 이력 있는 연결선이라 그 여객 기간만 넣고 분모 밖(화물·연결선 규칙, 모선 지선 계통 route_extra 선례). 知立信号所 名古屋本線 41.7(牛田 40.9–東知立 42.5, 위키 名古屋本線 노선도) (7회차 근거 r7out/E 7번; 구조 2026-11-14). 여객 기간 시작(선로는 1928-06-01부터지만 그 앞뒤 화물 기간은 넣지 않음)"}
