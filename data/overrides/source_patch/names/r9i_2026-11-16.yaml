- {"patch": "add", "entity_type": "line", "id": "l_miike_railway_tamana_line", "lang": "ja", "text": "三池鉄道玉名線", "source": "wikipedia", "why": "[三池鉄道 玉名線] 三池炭鉱専用鉄道 玉名支線(1944 三井化学玉名専用鉄道 개통, 1948~1949 従業員輸送)이 1964-08-11 全線 地方鉄道 변경으로 일반 여객 영업(ja.wikipedia 三池鉄道 oldid=110174652 「1964年8月11日 - 全線地方鉄道に変更」「玉名線：原万田駅 - 平井駅間 (4.2km)」 駅一覧 「原万田駅 - 大平駅 - 宮内駅 - 大谷駅 - 平井駅」, 중간; 三池炭鉱専用鉄道研究所 大平駅·宮内駅 쪽 「1964（昭和39）年08月 地方鉄道・三池鉄道線として営業運転開始」「1973（昭和48）年07月 地方鉄道・三池鉄道線としての営業運転終了」, 중간; 국토교통성 해설 「三池港～万田／平井間が大人片道25円」; 『私鉄統計年報』 昭和41年度 여객 延日キロ 4,271÷365=11.7=本線 4.3+玉名 4.1+勝立 3.3, 높음 — 결정 116). 1973-08-01 全線 専用鉄道로 되돌림(같은 위키·국립공문서관 1973-07-20 件名 「三池浜、三池港間外の地方鉄道運輸営業の廃止について」), 그 뒤 従業員輸送은 専用이라 기록 밖. 営業キロ 4.1(통계 계산, 위키 4.2와 엇갈림 — 1970 지형도 선로 실측 4.11 km가 4.1과 맞음)"}
