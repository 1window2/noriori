# 11회차 S3 구조 패치 (2026-11-16): 和歌山線 短絡線 1962-03-01~1972-03-15 여객 경유를 지선 계통으로 (江若 乗入 膳所–浜大津과 같은 장치)
- {"patch": "add", "entity_type": "route", "id": "r_wakayama_line_tainose_wakayama", "lang": "ja", "text": "田井ノ瀬～和歌山", "kana": "たいのせ～わかやま", "source": "rule", "why": "[和歌山線 短絡線 田井ノ瀬–東和歌山] 田井ノ瀬–(東)和歌山 短絡線 4.6 km는 1961-07-01 사용 개시 뒤 1972-03-15까지 영업 km 없는 和歌山線 貨物支線이었는데(『鉄道公報』1962-12-20 「田井ノ瀬・東和歌山短絡線は、和歌山線貨物支線とし」), 1962-03-01 신설 準急 「はまゆう」(京都·名古屋–奈良–和歌山線–東和歌山–白浜口) 등 여객 열차가 지났다: 国鉄 『鉄道統計年報 昭和40年度 第1編 別冊』 106쪽 各駅旅客発着通過人員 「和歌山短絡線 〔4.6〕 147,518」(쪽 그림 판독, 높음, 11회차 R2), 鉄道ピクトリアル 1962-04 「3月1日ダイヤ改正で花々しく登場したDC準急「はまゆう号」」, 車輛工学 1962-05 경로도 「奈良 東和歌山 白浜口 (和歌山線)(紀勢本線)」, 旅 1962-04 시각표(서로 독립 중간 셋, 11회차 R3), 鉄道ピクトリアル 2000-03 「この短絡線は,まず貨物営業より始まり,和歌山線を経由する「はまゆう」なども走り」, 위키 和歌山線 rev111780335. 화물·연결선 규칙: 여객 이력 기간만 和歌山線 지선 계통으로 기록하고 분모 밖. 1972-03-15 정식 여객 영업부터는 같은 선로가 和歌山線 본선 칸(기간이 겹치지 않음). 1961-10-01 団体専用 準急 「南紀観光」은 일반 영업이 아니라 뺌 (11회차 S3 2026-11-16, 4회차 kinki_3-004) / 읽기: 끝 역 노드 읽기(n_tainose たいのせ, n_wakayama わかやま)"}
