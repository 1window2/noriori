- {"patch": "add", "entity_type": "node", "id": "n_horikawa_seto", "lang": "ja", "text": "堀川", "kana": "ほりかわ", "source": "wikipedia", "why": "[瀬戸線] 名鉄瀬戸線 oldid=111605367, 土居下駅 oldid=111451630, 堀川駅 (愛知県) oldid=111605009: お濠区間 표 堀川 0.0, 本町 0.7, 大津町 1.0, 土居下 2.2, 清水 2.8 「1976年2月15日：…堀川 - 東大手間（1.9 km）廃止、東大手 - 清水間（0.6 km）休止」「1976年2月15日の堀川 - 土居下間廃止後、土居下駅から0.4 km清水駅寄りに土居下駅（仮）が仮設」「1978年8月20日：…土居下駅廃止」. 東大手(옛)는 1944~1978 休止라 지나가기만 함. 栄町 신선과 경로가 달라 지선 계통 r_seto_line_horikawa로 둠(owned, also로 清水–尾張瀬戸 공유). 재생성으로 원본에 생기면 지움. 좌표 N05 瀬戸線 1950~1975(土居下(仮)는 1976~1977) 역 점"}
