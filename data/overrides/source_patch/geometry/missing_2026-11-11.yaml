# 빠진 노선 6개(2026-11-11)의 선형 보정. OSM 미사용. 下河原線 北府中–東京競馬場前은 생성기가 OSM 선을 붙여서 N05 「中央本線東京競馬場前支線」(1934–1973) 좌표로 바꿈. 名鉄 小坂井支線은 N05 조각(伊奈 남동 1.3km에서 분기, 합 1.9km)이 営業キロ 1.2km보다 길어 名古屋本線(N02)을 따라 0.8km 간 뒤 남서쪽에서 小坂井에 드는 손 선형으로 1.2km에 맞춤(분기 위치 불확실). よかトピアガイドウェイバス는 福岡市 市史編さん室 会場図를 地理院地図에 정합한 노선(東ゲート–遊戯施設前 실측 0.844km)으로, 생성기가 붙인 OSM 근처 선을 바꿈 (연구 원자료 r3/insert_pkg·yokatopia)
