name: Release
# v1.2.3 태그를 올리면 서명 없는 IPA를 GitHub Releases에 올리고 AltStore·SideStore 소스(altstore.json)를 다시 만든다
# 소스 주소: https://github.com/1window2/noriori/releases/latest/download/altstore.json
# 정식 서명 APK는 키를 CI에 두지 않으므로 로컬에서 만들어 같은 릴리스에 올린다 (ARCHITECTURE §4.5)
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  # 버전과 판 번호를 macOS 빌드 전에 본다
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 태그와 pubspec의 버전이 다르면 멈춘다. AltStore는 IPA 안의 버전으로 업데이트를 판단한다
      - id: ver
        run: |
          v=$(sed -n 's/^version: *\([0-9.]*\)+\([0-9]*\).*/\1/p' apps/noriori/pubspec.yaml)
          b=$(sed -n 's/^version: *\([0-9.]*\)+\([0-9]*\).*/\2/p' apps/noriori/pubspec.yaml)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "태그 $GITHUB_REF_NAME 와 pubspec 버전 $v 가 다릅니다"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "build=$b" >> "$GITHUB_OUTPUT"
      # 빌드 번호는 앞선 릴리스의 IPA보다 커야 한다. 같으면 기기가 업데이트로 보지 않는다
      - name: 빌드 번호
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp > releases.json
          python3 -I tools/altstore_source.py --check-build "${{ steps.ver.outputs.build }}" "$GITHUB_REF_NAME" releases.json
      # 직전 태그 뒤 데이터가 바뀌었는데 판 번호가 그대로면 앱이 새 팩을 받지 않는다
      - name: 판 번호
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$GITHUB_SHA^" 2>/dev/null || true)
          test -n "$prev" || { echo "앞선 태그 없음"; exit 0; }
          if git diff --quiet "$prev" "$GITHUB_SHA" -- data/source data/overrides data/sources.json ':!data/overrides/as_of.json'; then exit 0; fi
          old=$(git show "$prev:data/overrides/as_of.json" | python3 -c 'import json,sys;print(json.load(sys.stdin)["edition"])')
          new=$(python3 -c 'import json;print(json.load(open("data/overrides/as_of.json"))["edition"])')
          test "$old" != "$new" || { echo "$prev 뒤 데이터가 바뀌었는데 판이 $new 그대로입니다"; exit 1; }

  data:
    uses: ./.github/workflows/data.yml

  # 시험이 실패한 커밋에는 IPA를 올리지 않는다
  flutter:
    needs: data
    uses: ./.github/workflows/flutter.yml

  ios:
    needs: [check, flutter]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: noriori-data
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
      - run: flutter pub get
      - name: 릴리스 빌드 (서명 없음)
        working-directory: apps/noriori
        run: flutter build ios --release --no-codesign
      # 사이드로드 도구가 설치할 때 자기 Apple ID로 서명한다
      - name: IPA 묶기
        working-directory: apps/noriori/build/ios/iphoneos
        run: |
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry "noriori-${{ needs.check.outputs.version }}-b${{ needs.check.outputs.build }}.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: noriori-ipa
          path: apps/noriori/build/ios/iphoneos/noriori-*.ipa
          retention-days: 3

  # IPA와 데이터 팩을 올린다. 둘 다 이 실행이 만든 것이라는 빌드 증명(attestation)을 붙인다.
  # 팩 매니페스트 서명(manifest.json.sig)은 개인 키를 CI에 두지 않으므로 올린 뒤 로컬에서 붙인다(tools/release_pack.sh, ARCHITECTURE §4.5)
  publish:
    needs: [check, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: noriori-ipa
      - uses: actions/download-artifact@v4
        with:
          name: noriori-data
          path: data-artifact
      # 앱에 넣은 것과 같은 팩을 하나로 묶는다. manifest.json은 서명 대상이라 따로도 올린다
      - name: 데이터 팩 묶기
        run: |
          ed=$(python3 -c 'import json;print(json.load(open("data-artifact/apps/noriori/assets/pack/manifest.json"))["edition"])')
          (cd data-artifact/apps/noriori/assets/pack && rm -f manifest.json.sig && zip -qrX "$GITHUB_WORKSPACE/noriori-pack-$ed.zip" .)
          cp data-artifact/apps/noriori/assets/pack/manifest.json manifest.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            noriori-*.ipa
            noriori-pack-*.zip
            manifest.json
      - name: 릴리스에 IPA·팩 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # 다시 돌린 실행은 팩·매니페스트를 새로 올리므로 앞서 붙인 서명은 맞지 않는다. 지우고 tools/release_pack.sh로 다시 서명한다
            gh release delete-asset "$GITHUB_REF_NAME" manifest.json.sig -y 2>/dev/null || true
            gh release upload "$GITHUB_REF_NAME" noriori-*.ipa noriori-pack-*.zip manifest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" noriori-*.ipa noriori-pack-*.zip manifest.json --title "noriori ${{ needs.check.outputs.version }}" --generate-notes
          fi
      # 모든 릴리스의 IPA로 소스를 다시 만들어 이번 릴리스에 붙인다. latest/download 주소가 늘 최신 소스를 가리킨다
      - name: AltStore·SideStore 소스
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp > releases.json
          python3 -I tools/altstore_source.py releases.json altstore.json
          gh release upload "$GITHUB_REF_NAME" altstore.json --clobber
