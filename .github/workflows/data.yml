name: Data
# CI와 Release 워크플로가 불러서 돈다. 데이터 팩은 한 실행에 한 번만 만든다
on:
  workflow_call:

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 모든 커밋의 작성자·커미터가 가명(noreply) 하나인지 본다. 다른 주소가 하나라도 있으면 멈춘다.
      # GitHub 웹에서 squash merge하면 GitHub 서버가 커밋을 만든다(커미터 noreply@github.com, 작성자는 계정 기본 메일).
      # 그 병합 커밋은 의도된 것이라 검사에서 빼고, 직접 만든 커밋만 본다 (PR #1·#2 병합 뒤 main CI 실패, 2026-11-20)
      - name: 커밋 신원 검사
        run: |
          bad=$(git log --all --no-merges --format='%ae %ce' | awk '$2!="noreply@github.com"{print $1; print $2}' | sort -u | grep -vx '162031103+1window2@users.noreply.github.com' || true)
          if [ -n "$bad" ]; then echo "가명이 아닌 커밋 신원이 있습니다: $(echo "$bad" | wc -l)개"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      # 판은 data/sources.lock에 적힌 tippecanoe와 맞춘다
      - uses: actions/cache@v4
        id: tippecanoe
        with:
          path: ~/.local/tippecanoe
          key: tippecanoe-2.79.0-ubuntu-24.04
      - if: steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev zlib1g-dev
          curl -fsSL https://github.com/felt/tippecanoe/archive/refs/tags/2.79.0.tar.gz | tar xz
          make -C tippecanoe-2.79.0 -j4
          make -C tippecanoe-2.79.0 install PREFIX="$HOME/.local/tippecanoe"
      - run: echo "$HOME/.local/tippecanoe/bin" >> "$GITHUB_PATH"
      # 개인 경로, 비밀 키, 개인 메일 주소가 저장소에 들어가지 않았는지 본다
      - name: 개인 정보 검사
        run: "! git grep -nIE '/Users/[A-Za-z]|BEGIN [A-Z ]*PRIVATE KEY|@(gmail|icloud|naver|daum|outlook|hotmail)\\.com' -- . ':!.github/workflows'"
      - run: python3 tools/check_boundaries.py
      # 데이터가 저장소에 있으므로 실제 팩을 만들어 store 시험이 건너뛰지 않게 한다
      - run: bash tools/all.sh
      - run: bash tools/sync_pack.sh
      - run: test -f build/core_fixture.json && test -f build/master.sqlite && test -f build/names.sqlite && test -f build/rail.pmtiles
      # 같은 실행의 Flutter·Android·iOS 잡이 이 결과로 시험하고 빌드한다. 팩을 다시 만들지 않아 macOS 시간을 아낀다
      - uses: actions/upload-artifact@v4
        with:
          name: noriori-data
          path: |
            build/
            apps/noriori/assets/pack/
          retention-days: 3
