name: lint-test
on: [push, pull_request]

# 같은 브랜치에 새로 올리면 앞의 실행은 멈춘다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      # 판은 data/sources.lock에 적힌 tippecanoe와 맞춘다
      - uses: actions/cache@v4
        id: tippecanoe
        with:
          path: ~/.local/tippecanoe
          key: tippecanoe-2.79.0-ubuntu-24.04
      - if: steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev zlib1g-dev
          curl -fsSL https://github.com/felt/tippecanoe/archive/refs/tags/2.79.0.tar.gz | tar xz
          make -C tippecanoe-2.79.0 -j4
          make -C tippecanoe-2.79.0 install PREFIX="$HOME/.local/tippecanoe"
      - run: echo "$HOME/.local/tippecanoe/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      # 개인 경로, 비밀 키, 개인 메일 주소가 저장소에 들어가지 않았는지 본다
      - name: 개인 정보 검사
        run: "! git grep -nIE '/Users/[A-Za-z]|BEGIN [A-Z ]*PRIVATE KEY|@(gmail|icloud|naver|daum|outlook|hotmail)\\.com' -- . ':!.github/workflows'"
      - run: python3 tools/check_boundaries.py
      # 데이터가 저장소에 있으므로 실제 팩을 만들어 store 시험이 건너뛰지 않게 한다
      - run: bash tools/all.sh
      - run: python3 -I tools/core_fixture.py
      - run: bash tools/sync_pack.sh
      - run: test -f build/core_fixture.json && test -f build/master.sqlite && test -f build/names.sqlite && test -f build/rail.pmtiles
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/noriori_store
      - run: dart run slang
        working-directory: apps/noriori
      # 생성 코드가 커밋된 것과 같은지 본다. slang의 생성 시각 줄은 뺀다
      - name: 생성 코드 diff
        run: |
          test -z "$(git ls-files --others --exclude-standard -- '*.g.dart')"
          git diff --exit-code -I '^/// Built on ' -- '*.g.dart'
      - run: flutter analyze
      - run: dart test
        working-directory: packages/noriori_core
      - run: dart test
        working-directory: packages/noriori_store
      - run: flutter test
        working-directory: apps/noriori
      # 정식 서명 키는 CI에 두지 않는다. 릴리스 빌드가 되는지만 보고, 디버그 서명 APK를 잠깐 보관한다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 릴리스 빌드
        working-directory: apps/noriori
        env:
          NORIORI_DEBUG_SIGNING: '1'
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: noriori-debug-signed-apk
          path: apps/noriori/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
