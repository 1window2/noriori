name: Android
# Data 워크플로가 통과하면 그 실행의 데이터 팩으로 릴리스 빌드를 한다
on:
  workflow_run:
    workflows: [Data]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: noriori-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
      # maplibre_gl이 Java 21을 요구한다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get
      # 정식 서명 키는 CI에 두지 않는다. 릴리스 빌드가 되는지만 보고, 디버그 서명 APK를 잠깐 보관한다
      - name: 릴리스 빌드
        working-directory: apps/noriori
        env:
          NORIORI_DEBUG_SIGNING: '1'
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: noriori-debug-signed-apk
          path: apps/noriori/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
