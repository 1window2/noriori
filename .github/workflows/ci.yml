name: CI
# PR과 main push마다 데이터 팩을 한 번 만들고, 그 팩으로 Flutter 시험과 Android·iOS 빌드를 돌린다. 모두 PR 체크에 보인다
# 브랜치 push는 PR이 있을 때 pull_request로만 돈다. 같은 커밋을 두 번 돌리지 않는다
on:
  push:
    branches: [main]
  pull_request:
  # 손으로도 돌릴 수 있다 (Actions 탭의 Run workflow)
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR이나 브랜치에 새로 올리면 앞의 실행은 멈춘다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  data:
    uses: ./.github/workflows/data.yml

  flutter:
    needs: data
    uses: ./.github/workflows/flutter.yml

  android:
    needs: data
    uses: ./.github/workflows/android.yml

  # private 저장소에서는 macOS 실행 시간이 10배로 차감되어 main push에서만 돈다. 저장소가 공개되면 PR에서도 돈다
  ios:
    needs: data
    if: github.event_name == 'push' || !github.event.repository.private
    uses: ./.github/workflows/ios.yml
