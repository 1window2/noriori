publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  crypto: ^3.0.6
  cryptography: ^2.9.0
  drift: 2.35.3
  noriori_core:
    path: ../noriori_core
  path: ^1.9.1
  sqlite3: 3.5.2

dev_dependencies:
  build_runner: any
  drift_dev: any
  lints: ^6.1.0
  test: any
