<title>노리노리 노선도 비교</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 두 칸 고정 높이: 왼쪽은 위키 원본 종이, 오른쪽은 앱 화면 */
:root{--bg:#EEF0EC;--panel:#FBFBF8;--fg:#1B1F1D;--mut:#6A716C;--faint:#A9AFAA;--line:#D9DCD5;--main:#1B1F1D;--ride:#1766D6;--on:#E2ECFB;--onfg:#114FA8;--brline:#9AA19B;--brtext:#5F6661;--goneline:#E3E6E0;--gonetext:#BFC4BE;--hover:#1B1F1D;--ui:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--paper:#FFFFFF;--paperfg:#202122;--paperlink:#0B57C2;--papermut:#54595D;--paperhi:#FFF1B8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141715;--panel:#1C201D;--fg:#ECEFEA;--mut:#A0A7A1;--faint:#6E756F;--line:#343A35;--main:#F1F3EE;--ride:#6EA8FF;--on:#1D3355;--onfg:#BCD5FF;--brline:#7C847D;--brtext:#AEB5AF;--goneline:#2F3530;--gonetext:#59605A;--hover:#F1F3EE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141715;--panel:#1C201D;--fg:#ECEFEA;--mut:#A0A7A1;--faint:#6E756F;--line:#343A35;--main:#F1F3EE;--ride:#6EA8FF;--on:#1D3355;--onfg:#BCD5FF;--brline:#7C847D;--brtext:#AEB5AF;--goneline:#2F3530;--gonetext:#59605A;--hover:#F1F3EE;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);display:flex;flex-direction:column;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:10px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ride);outline-offset:1px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
h1{font-size:16px;font-weight:600;margin:0;white-space:nowrap}
.tabs,.seg{display:flex;gap:2px;background:var(--line);padding:2px;border-radius:8px}
.tabs button,.seg button{padding:5px 10px;font-size:13px;border-radius:6px;color:var(--mut);display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.tabs button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--panel);color:var(--fg);font-weight:500}
.tabs small{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.opt{display:flex;gap:12px;font-size:13px;color:var(--mut);margin-left:auto;flex-wrap:wrap}
.opt label{display:flex;gap:5px;align-items:center;cursor:pointer}
.vis{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line)}
.vis label{display:flex;gap:5px;align-items:center;cursor:pointer;min-height:24px}
.seg{display:none}
.panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;position:relative}
.ph{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 12px;font-size:12.5px;flex-wrap:wrap}
.ph b{font-weight:600;font-size:13px}
.ph b small{font-weight:400;font-size:12px;color:var(--mut);margin-left:6px}
#wp{background:var(--paper);color:var(--paperfg);color-scheme:light}
#wp .ph{border-bottom:1px solid #E4E6E8;color:var(--papermut)}
#wp .ph b{color:var(--paperfg)}
#w{flex:1;overflow:auto;padding:6px 10px 40px;font-size:12px;line-height:20px;position:relative}
.sec{font-size:12px;font-weight:600;color:var(--papermut);padding:12px 0 4px;background:var(--paper)}
.wr{display:flex;height:20px;white-space:nowrap;align-items:center;cursor:default}
.wr.s{cursor:pointer}
.wr.hi{background:var(--paperhi)}
.dg{flex:none;display:flex;justify-content:center;width:var(--dgw)}
.c{width:20px;height:20px;background-size:20px 20px;background-repeat:no-repeat;flex:none}
.wk{flex:none;width:58px;text-align:right;padding-right:8px;color:var(--papermut);font-variant-numeric:tabular-nums;font-size:11.5px;overflow:hidden}
.wt{flex:none}
.wr.s .wt{color:var(--paperlink)}
.src{font-size:11.5px;color:var(--papermut);padding:14px 0 0;white-space:normal;line-height:1.6;max-width:44em}
.src a{color:var(--paperlink)}
#op{background:var(--panel)}
#op .ph{border-bottom:1px solid var(--line);color:var(--mut)}
#o{flex:1;overflow:auto;overscroll-behavior:contain}
#ow{max-width:420px;margin:0 auto}
svg{display:block;width:100%;height:auto}
.hit{fill:var(--hover);fill-opacity:0;cursor:pointer}
.hit:hover{fill-opacity:.05}
.hit:focus-visible{outline:none;stroke:var(--ride);stroke-width:1.5;fill-opacity:.05}
.hit.flash{fill:var(--ride);fill-opacity:.14}
.n{font-size:15px;font-weight:500;fill:var(--fg)}
.nx{font-size:14px;font-weight:400;fill:var(--gonetext)}
.nx .j,.kmx{fill:var(--gonetext)}
.j{font-size:12px;fill:var(--mut)}
.km{font-size:12px;fill:var(--mut);font-variant-numeric:tabular-nums}
.km.kmx{fill:var(--gonetext)}
.bl{font-size:13px;fill:var(--brtext)}
.bl.o{font-size:12px}
.tl{font-size:12px;fill:var(--brtext)}
.tl .g,.tl.g,.bl.g,.bd.g{fill:var(--gonetext)}
.tl .sep{fill:var(--faint)}
.pn{font-size:9.5px;font-weight:600;fill:var(--brtext)}
.pn.g{fill:var(--gonetext)}
.bd{font-size:11.5px;fill:var(--brtext)}
.bar{border-top:1px solid var(--line);padding:9px 12px;padding-bottom:max(9px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px;min-height:52px;flex-wrap:wrap}
.bar .sum{min-width:0}
.bar small{display:block;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:6px}
.b{padding:7px 12px;border-radius:7px;font-size:13px;border:1px solid var(--line)}
.b.p{background:var(--ride);color:#fff;border-color:var(--ride);font-weight:500}
:root[data-theme="dark"] .b.p{color:#0B1A33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b.p{color:#0B1A33}}
.toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:var(--fg);color:var(--panel);padding:8px 12px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px);text-align:center;width:max-content}
@media (max-width:760px){
 .panes{grid-template-columns:minmax(0,1fr)}
 .seg{display:flex}
 .pane[data-off="1"]{display:none}
 .opt{margin-left:0}
 .tabs small{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<style>/*ICONCSS*/</style>
<div class="top">
  <h1>노리노리 노선도 비교</h1>
  <div class="tabs" id="tabs" role="group" aria-label="노선"></div>
  <div class="seg" id="seg" role="group" aria-label="화면"><button data-p="w" aria-pressed="false">위키 버전</button><button data-p="o" aria-pressed="true">위키식</button></div>
  <div class="opt">
    <label><input type="checkbox" id="sync" checked> 양쪽 같이 스크롤</label>
  </div>
</div>
<div class="panes">
  <section class="pane" id="wp" data-off="1" aria-label="위키 버전">
    <div class="ph"><b>위키 버전</b><span id="wsub"></span></div>
    <div id="w"></div>
  </section>
  <section class="pane" id="op" aria-label="위키식">
    <div class="ph"><b>위키식 <small>캡슐은 환승, 곡선은 선로 분기, 번호는 같은 방향 노선 묶음</small></b><span id="stat"></span></div>
    <div class="vis" role="group" aria-label="노선도 표시 설정">
      <label><input type="checkbox" id="old" checked> 폐역·폐선 표시</label>
      <label><input type="checkbox" id="arc" checked> 열람 전용 역·노선 포함</label>
    </div>
    <div id="o"><div id="ow"></div></div>
    <div class="bar" id="bar"></div>
  </section>
</div>
<script>
const D=/*DATA*/null;
const W=380,T=66,NX=114,LX=198,SX=82,QX=99,BR=6,DX=18;
// 값이 없으면 true로 온다. 화면에서만 ?로 적는다
const yr=v=>v===true?"?":v;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={line:0,old:true,arc:true,sync:true,a:null,b:null,rides:{},P:null,wy:[]};
D.forEach(L=>{S.rides[L.key]=store.get("rides-"+L.key)||[{a:L.ex[0],b:L.ex[1],ex:1}]});
const est=(s,z)=>[...String(s)].reduce((a,c)=>a+(/[가-힣]/.test(c)?z*.93:c===" "?z*.3:z*.6),0);
const L=()=>D[S.line];
const rides=()=>S.rides[L().key];
function renderWiki(){
 const l=L(),dgw=Math.min(l.wiki.reduce((m,x)=>Math.max(m,(x.c||[]).length),1),9)*20;
 const h=[];
 l.wiki.forEach((x,i)=>{
  if(x.sec){h.push(`<div class="sec">${esc(x.sec)}</div>`);return}
  const s=l.st.find(q=>q.w===i);
  const cells=x.c.map(st=>`<span class="c"${st.length?` style="background-image:${st.map(n=>`var(--i${n})`).join(",")}"`:""}></span>`).join("");
  h.push(`<div class="wr${s?" s":""}" data-r="${i}"><div class="dg">${cells}</div><div class="wk">${esc(x.k)}</div><div class="wt">${esc(x.t)}</div></div>`);
 });
 const links=l.src.map(([t,u])=>`<a href="${encodeURI(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join(", ");
 h.push(`<p class="src">출처: 일본어 위키백과 ${links} (CC BY-SA 4.0). 노선도 그림은 Wikimedia Commons의 BSicon. 문서마다 범위가 달라 필요한 구간만 이어 붙였고, 각주는 뺐습니다.</p>`);
 const w=$("#w");w.style.setProperty("--dgw",dgw+"px");w.innerHTML=h.join("");
 $("#wsub").textContent=l.ja+" · "+l.sub;
}
function layout(){
 const l=L(),show=e=>(S.old||!e.x)&&(S.arc||!e.h),st=l.st.filter(show);
 const P={st,y:[],h:[],stat:"",hits:[],txt:[],stems:[],deco:[],badge:[]};
 const tailOf=b=>b.x?"~"+yr(b.x):b.since?b.since+"~":"";
 const lxOf=b=>Math.max(LX,NX+est(b.l,13)+10);
 const wide=b=>!!b.n&&est(`${b.n} › ${b.d}`,11.5)>W-lxOf(b)-12-(tailOf(b)?40:0);
 const preds=b=>S.old&&b.pred?b.pred:[];
 const rowH=b=>29+15*preds(b).length+(wide(b)?14:0);
 // 가지 한 줄: 이어받기 전 이름은 위에 흐리게, 지금 이름은 그 아래에
 const drawRow=(b,i,ry)=>{
  let yy=ry;
  preds(b).forEach(p=>{P.txt.push(`<text x="${NX}" y="${yy+12}" class="bl o g">${esc(p.l)}</text><text x="${W-12}" y="${yy+12}" text-anchor="end" class="bd g">~${esc(p.y)}</text>`);yy+=15});
  const gc=b.x?" g":"",tail=S.old?tailOf(b):"";
  P.txt.push(`<text x="${NX}" y="${yy+13}" class="bl${gc}">${esc(b.l)}</text>`);
  if(tail)P.txt.push(`<text x="${W-12}" y="${yy+13}" text-anchor="end" class="bd${gc}">${esc(tail)}</text>`);
  const a=`${b.n} › ${b.d}`;
  if(wide(b))P.txt.push(`<text x="${NX}" y="${yy+28}" class="bd${gc}">${esc(a)}</text>`);
  else if(b.n)P.txt.push(`<text x="${lxOf(b)}" y="${yy+13}" class="bd${gc}">${esc(a)}</text>`);
  P.hits.push({i,b,x:0,y:ry,h:rowH(b),kind:"b"});
  return yy+9;
 };
 const stub=(b,y0,y1,i,hy)=>{
  P.deco.push(`<path d="M${T} ${y0}V${y1}" stroke="var(--brline)" stroke-dasharray="3 4"/>`);
  P.txt.push(`<text x="${NX}" y="${hy+13}" class="bl">${esc(b.l)}</text><text x="${Math.max(LX,NX+est(b.l,13)+10)}" y="${hy+13}" class="bd">${esc(b.n)}</text>`);
  P.hits.push({i,b,x:0,y:hy,h:29,kind:"b"});
 };
 let cur=8;
 st.forEach((s,i)=>{
  const bs=s.b.filter(show),ps=s.x?[]:s.p.filter(show);
  const ups=bs.filter(b=>b.side==="u"),dns=bs.filter(b=>b.side!=="u");
  const hc=s.x?32:46,endU=i===0&&s.end&&s.end.side==="u";
  const upH=ups.reduce((a,b)=>a+rowH(b),0)+(endU?30:0);
  const y=cur+upH+(upH?4:0)+hc/2;
  if(endU)stub(s.end,y-13,y-31,i,cur);
  let uy=cur+(endU?30:0);
  ups.forEach(b=>{const cy=drawRow(b,i,uy);
   P.stems.push({x:!!b.x,d:`M${T} ${y}L${SX-BR} ${y}A${BR} ${BR} 0 0 0 ${SX} ${y-BR}L${SX} ${cy+BR}A${BR} ${BR} 0 0 1 ${SX+BR} ${cy}L${QX-5} ${cy}`});
   P.deco.push(`<circle cx="${QX}" cy="${cy}" r="5" fill="var(--panel)" stroke="${b.x?"var(--goneline)":"var(--brline)"}"/>`);
   uy+=rowH(b)});
  P.y.push(y);
  const kw=s.k.length*14,jw=s.j.length*12,av=W-NX-58,nc=s.x?"nx":"n";
  let extra=0;
  if(kw+6+jw<=av){P.txt.push(`<text x="${NX}" y="${y+5}" class="${nc}">${esc(s.k)}<tspan class="j" dx="6">${esc(s.j)}</tspan></text>`)}
  else if(kw<=av){P.txt.push(`<text x="${NX}" y="${y+2}" class="${nc}">${esc(s.k)}</text><text x="${NX}" y="${y+17}" class="j" style="font-size:11px">${esc(s.j)}</text>`);extra=4}
  else{const n=Math.floor(av/14),ls=[];for(let q=0;q<s.k.length;q+=n)ls.push(s.k.slice(q,q+n));ls.forEach((t,q)=>P.txt.push(`<text x="${NX}" y="${y+5+q*19}" class="${nc}">${esc(t)}</text>`));P.txt.push(`<text x="${NX}" y="${y+3+ls.length*19}" class="j" style="font-size:11px">${esc(s.j)}</text>`);extra=(ls.length-1)*19+16}
  P.txt.push(`<text x="${W-12}" y="${y+4}" text-anchor="end" class="km${s.x?" kmx":""}">${s.nk?"?":s.m.toFixed(1)}</text>`);
  if(s.x)P.txt.push(`<text x="${W-52}" y="${y+4}" text-anchor="end" class="bd g">~${esc(s.y||"?")}</text>`);
  // 환승: 세로선 모양이 같은 노선을 한 점에 묶고, 묶음이 둘 이상이면 왼쪽부터 번호를 붙인다
  let cy=y+22+extra;
  const lim=W-NX-12,lab=e=>e.l+(e.v?`(${e.v})`:"")+(e.x?` ~${yr(e.x)}`:"");
  const flowOf=e=>e.t?"b":e.dir||"d";
  const groups=["b","u","d"].map(f=>({f,m:ps.filter(e=>flowOf(e)===f)})).filter(g=>g.m.length);
  const marker=(n,cx,yy,gone,rd)=>`<circle cx="${cx}" cy="${yy}" r="${rd}" fill="var(--panel)" stroke="${gone?"var(--goneline)":"var(--brline)"}" stroke-width="1.6"/><text x="${cx}" y="${yy+3.4}" text-anchor="middle" class="pn${gone?" g":""}">${n}</text>`;
  const write=(items,x,w)=>{
   items.filter(e=>preds(e).length).forEach(e=>{
    preds(e).forEach(p=>{P.txt.push(`<text x="${x}" y="${cy+3}" class="tl g">${esc(p.l)} ~${esc(p.y)}</text>`);cy+=15});
    P.txt.push(`<text x="${x}" y="${cy+3}" class="tl">${esc(e.l)} ${esc(e.since)}~</text>`);cy+=16});
   const flow=[];
   items.filter(e=>!preds(e).length).forEach(e=>{const op=e.l.split(" ")[0],g=e.v&&!e.x&&flow.find(f=>f.v===e.v&&!f.x&&f.l.split(" ")[0]===op),add=g&&"·"+e.l.slice(op.length+1);
    if(g&&est(lab(g)+add,12)<=w)g.l+=add;else flow.push({...e})});
   let line=[],lw=0;
   const flush=()=>{if(!line.length)return;P.txt.push(`<text x="${x}" y="${cy+3}" class="tl">${line.map((e,q)=>`${q?'<tspan class="sep"> · </tspan>':""}<tspan${e.x?' class="g"':""}>${esc(lab(e))}</tspan>`).join("")}</text>`);cy+=16;line=[];lw=0};
   flow.forEach(e=>{const t=est(lab(e),12),sep=est(" · ",12);if(line.length&&lw+sep+t>w)flush();lw+=(line.length?sep:0)+t;line.push(e)});flush();
  };
  const numbered=groups.length>1;
  if(numbered)groups.forEach((g,k)=>{const top=cy;write(g.m,NX+18,lim-18);P.txt.push(marker(k+1,NX+7,top-1,g.m.every(e=>e.x),6.5))});
  else if(ps.length)write(ps,NX,lim);
  const capH=cy-(y+22+extra);
  if(groups.length){
   const n=groups.length,lo=T-DX*n,rd=numbered?6.5:4.5;
   groups.forEach((g,k)=>{const cx=T-DX*(n-k),gone=g.m.every(e=>e.x),c=gone?"var(--goneline)":"var(--brline)";
    const up=g.f!=="d",dn=g.f!=="u";
    // 연속된 환승역의 점선이 겹치지 않도록 역 사이 절반 안에서 끝낸다
    P.deco.push(`<path d="M${cx} ${up?y-18:y}V${dn?y+18:y}" stroke="${c}"/>`);
    [[21,3,.8],[26,2,.45]].forEach(([d,l,o])=>P.deco.push(`<path d="${up?`M${cx} ${y-d}v-${l}`:""}${dn?`M${cx} ${y+d}v${l}`:""}" stroke="${c}" stroke-opacity="${o}"/>`));
    if(numbered)P.badge.push(marker(k+1,cx,y,gone,rd));
    else P.deco.push(`<circle cx="${cx}" cy="${y}" r="${rd}" fill="var(--panel)" stroke="${c}"/>`)});
   P.deco.push(`<rect x="${lo-10}" y="${y-13}" width="${T+13-(lo-10)}" height="26" rx="13" fill="none" stroke="${ps.every(e=>e.x)?"var(--goneline)":"var(--brline)"}" stroke-width="1.5"/>`);
  }
  const top=y-hc/2,hb=hc+extra+(capH?capH-4:0);
  P.hits.push({i,x:0,y:top,h:hb,kind:"s"});
  let ry=top+hb+(capH?2:s.x?0:-1);
  dns.forEach(b=>{const cy2=drawRow(b,i,ry);
   P.stems.push({x:!!b.x,d:b.e?`M${T} ${cy2-BR-6}V${cy2-BR}A${BR} ${BR} 0 0 0 ${T+BR} ${cy2}L${QX-5} ${cy2}`:`M${T} ${y}L${SX-BR} ${y}A${BR} ${BR} 0 0 1 ${SX} ${y+BR}L${SX} ${cy2-BR}A${BR} ${BR} 0 0 0 ${SX+BR} ${cy2}L${QX-5} ${cy2}`});
   P.deco.push(`<circle cx="${QX}" cy="${cy2}" r="5" fill="var(--panel)" stroke="${b.x?"var(--goneline)":"var(--brline)"}"/>`);
   ry+=rowH(b)});
  if(i===st.length-1&&s.end&&s.end.side==="d"){stub(s.end,y+13,ry+20,i,ry+6);ry+=36}
  cur=dns.length||capH?ry+6:top+hb+((i<st.length-1&&st[i+1].x)?0:0);
 });
 P.H=cur+24;
 return P;
}
function ride(k1,k2){const a=Math.min(k1,k2),b=Math.max(k1,k2);return rides().some(r=>Math.min(r.a,r.b)-.001<=a&&Math.max(r.a,r.b)+.001>=b)}
function nodeState(s){
 const rs=rides();
 if(rs.some(r=>r.a===s.m||r.b===s.m))return 2;
 if(rs.some(r=>Math.min(r.a,r.b)<s.m&&Math.max(r.a,r.b)>s.m))return 1;
 return 0;
}
function paint(){
 const P=S.P,o=[],m=[];
 const lo=S.a!=null&&S.b!=null?Math.min(S.a,S.b):null,hi=S.a!=null&&S.b!=null?Math.max(S.a,S.b):null;
 const lastOpen=P.st.reduce((a,s,i)=>s.x?a:i,0);
 for(let i=0;i<P.st.length-1;i++){
  const on=lo!=null&&i>=lo&&i<hi,r=ride(P.st[i].m,P.st[i+1].m);
  if(i>=lastOpen){o.push(`<path d="M${T} ${P.y[i]}V${P.y[i+1]}" stroke="var(--goneline)" stroke-width="5"/>`);continue}
  o.push(`<path d="M${T} ${P.y[i]}V${P.y[i+1]}" stroke="${r||on?"var(--ride)":"var(--main)"}" stroke-width="9"${on&&!r?' stroke-dasharray="10 5"':""}/>`);
 }
 P.st.forEach((s,i)=>{
  const st=nodeState(s),sel=i===S.a||i===S.b,y=P.y[i],r=s.x?5.5:8.5;
  const c=st||sel?"var(--ride)":s.x?"var(--gonetext)":"var(--main)",fill=st===2||sel?"var(--ride)":"var(--panel)";
  m.push(`<circle cx="${T}" cy="${y}" r="${s.x?4.5:r}" fill="${fill}" stroke="${c}" stroke-width="${s.x?2:3.5}"${s.x&&!sel?' opacity=".75"':""}/>`);
  if(sel)m.push(`<circle cx="${T}" cy="${y}" r="13" fill="none" stroke="var(--ride)" stroke-width="2"/>`);
 });
 $("#tr").innerHTML=o.join("");$("#nd").innerHTML=m.join("");
 stats();bar();
}
function stats(){
 const l=L(),seg=rides().map(r=>[Math.min(r.a,r.b),Math.max(r.a,r.b)]).sort((a,b)=>a[0]-b[0]);
 let t=0,e=-1;seg.forEach(([a,b])=>{if(a>e){t+=b-a;e=b}else if(b>e){t+=b-e;e=b}});
 $("#stat").textContent=`${l.name} · ${t.toFixed(1)} / ${l.total.toFixed(1)} km (${(t/l.total*100).toFixed(1)}%)`;
}
function bar(){
 const P=S.P,a=S.a,b=S.b,e=$("#bar");
 if(a==null){const n=rides().length;e.innerHTML=`<div class="sum">출발역을 누르세요<small>기록 ${n}개${rides().some(r=>r.ex)?" · 처음 기록 1개는 예시":""}</small></div><div class="btns">${n?'<button class="b" id="clr">기록 비우기</button>':""}</div>`;const c=$("#clr");if(c)c.onclick=()=>{S.rides[L().key]=[];save();paint()};return}
 if(b==null){e.innerHTML=`<div class="sum"><span>${esc(P.st[a].k)}</span>에서 출발<small>도착역을 누르세요</small></div><div class="btns"><button class="b" id="cc">취소</button></div>`;$("#cc").onclick=clearSel;return}
 const s=P.st[a],t=P.st[b],km=Math.abs(s.m-t.m),n=Math.abs(a-b)+1;
 e.innerHTML=`<div class="sum">${esc(s.k)} → ${esc(t.k)}<small>${km.toFixed(1)} km · ${n}개 역</small></div><div class="btns"><button class="b" id="cc">취소</button><button class="b p" id="ok">기록</button></div>`;
 $("#cc").onclick=clearSel;$("#ok").onclick=()=>{rides().push({a:s.m,b:t.m});save();S.a=S.b=null;paint();toast("기록했어요")};
}
function save(){store.set("rides-"+L().key,S.rides[L().key])}
function clearSel(){S.a=S.b=null;paint()}
let tt;function toast(m){let t=$("#op .toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");$("#op").appendChild(t)}t.textContent=m;clearTimeout(tt);tt=setTimeout(()=>t.remove(),2200)}
function scale(){return $("#ow svg").getBoundingClientRect().width/W}
function renderOurs(){
 const P=S.P=layout();
 const hits=P.hits.map((h,q)=>`<rect class="hit" data-h="${q}" x="0" y="${h.y}" width="${W}" height="${h.h}" tabindex="0" role="button" aria-label="${esc(h.kind==="s"?P.st[h.i].k+" 역 "+P.st[h.i].m.toFixed(1)+"킬로미터":h.b.l)}"/>`).join("");
 $("#ow").innerHTML=`<svg viewBox="0 0 ${W} ${P.H}" role="group" aria-label="${esc(L().name)} 세로 노선도"><g fill="none" stroke-width="2.5" stroke-linejoin="round">${[...P.stems.filter(p=>p.x),...P.stems.filter(p=>!p.x)].map(p=>`<path d="${p.d}" stroke="${p.x?"var(--goneline)":"var(--brline)"}"/>`).join("")}</g><g fill="none" stroke-width="2.5">${P.deco.join("")}</g><g id="tr" fill="none"></g><g id="nd"></g>${P.badge.join("")}${P.txt.join("")}${hits}</svg>`;
 $("#ow svg").addEventListener("click",hit);
 $("#ow svg").addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();hit(ev)}});
 paint();measure();
}
function measure(){
 const w=$("#w"),P=S.P,base=w.getBoundingClientRect().top-w.scrollTop;
 S.wy=P.st.map(s=>{if(s.w==null)return null;const e=w.querySelector(`[data-r="${s.w}"]`);return e?e.getBoundingClientRect().top-base:null});
}
function flashWiki(i){
 const r=S.P.st[i].w;$("#w").querySelectorAll(".wr.hi").forEach(e=>e.classList.remove("hi"));
 if(r==null)return;const e=$("#w").querySelector(`[data-r="${r}"]`);if(!e)return;e.classList.add("hi");
 if(!S.sync)return;lock("o");const w=$("#w");w.scrollTop=S.wy[i]-w.clientHeight/2;
}
function hit(ev){
 const t=ev.target.closest(".hit");if(!t)return;const h=S.P.hits[+t.dataset.h];
 if(h.kind==="b"){
  const m=/東海道本線|山陽本線|宗谷本線/.exec(h.b.j);
  const k=m&&D.findIndex(l=>l.ja===m[0]);
  if(k>=0&&k!==null){const j=S.P.st[h.i].j;setLine(k);const i=S.P.st.findIndex(s=>s.j===j);if(i>=0)goto(i);toast(`${L().name} 화면으로 옮겼어요`);return}
  toast(h.b.h?`${h.b.l}: 열람 전용이라 기록할 수 없어요`:`${h.b.l} 기록 화면으로 넘어가요. 이 목업에는 세 노선만 들어 있어요`);return}
 const i=h.i,pick=S.P.st[i];
 if(pick.h){toast(`${pick.k}: ${pick.y?pick.y+"년":"연도 미상"} 폐역. 열람 전용이라 기록할 수 없고 지도 위치도 없어요`);flashWiki(i);return}
 if(S.a==null)S.a=i;else if(S.b==null){if(i===S.a)S.a=null;else S.b=i}else{S.a=i;S.b=null}
 paint();flashWiki(i);
}
function goto(i){const o=$("#o"),sc=scale();lock("w");o.scrollTop=S.P.y[i]*sc-o.clientHeight/2;flashWiki(i)}
let lk=null,lkt=0;function lock(by){lk=by;clearTimeout(lkt);lkt=setTimeout(()=>lk=null,160)}
function syncFromO(){
 if(!S.sync||lk==="w")return;lock("o");
 const o=$("#o"),sc=scale(),top=(o.scrollTop+o.clientHeight/2)/sc,P=S.P;
 let i=0;while(i<P.y.length-1&&P.y[i+1]<top)i++;
 let a=i;while(a>0&&S.wy[a]==null)a--;let b=i+1;while(b<P.y.length&&S.wy[b]==null)b++;
 if(S.wy[a]==null||b>=P.y.length)return;
 const f=Math.max(0,Math.min(1,(top-P.y[a])/(P.y[b]-P.y[a])));
 const w=$("#w");w.scrollTop=S.wy[a]+(S.wy[b]-S.wy[a])*f-w.clientHeight/2;
}
function syncFromW(){
 if(!S.sync||lk==="o")return;lock("w");
 const w=$("#w"),o=$("#o"),top=w.scrollTop+w.clientHeight/2,P=S.P,idx=[];
 S.wy.forEach((v,i)=>{if(v!=null)idx.push(i)});
 let q=0;while(q<idx.length-1&&S.wy[idx[q+1]]<top)q++;
 const a=idx[q],b=idx[Math.min(q+1,idx.length-1)];if(a===b)return;
 const f=Math.max(0,Math.min(1,(top-S.wy[a])/(S.wy[b]-S.wy[a])));
 o.scrollTop=(P.y[a]+(P.y[b]-P.y[a])*f)*scale()-o.clientHeight/2;
}
function setLine(i){S.line=i;S.a=S.b=null;document.querySelectorAll("#tabs button").forEach((b,k)=>b.setAttribute("aria-pressed",k===i));renderWiki();renderOurs();$("#o").scrollTop=0;$("#w").scrollTop=0}
$("#tabs").innerHTML=D.map((l,i)=>`<button aria-pressed="${i===0}" data-i="${i}">${esc(l.name)}<small>${l.total.toFixed(1)} km</small></button>`).join("");
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)setLine(+b.dataset.i)};
$("#seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;const p=b.dataset.p;document.querySelectorAll("#seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#wp").dataset.off=p==="w"?"0":"1";$("#op").dataset.off=p==="o"?"0":"1";measure()};
$("#sync").onchange=e=>{S.sync=e.target.checked};
$("#old").onchange=e=>{S.old=e.target.checked;S.a=S.b=null;renderOurs()};
$("#arc").onchange=e=>{S.arc=e.target.checked;S.a=S.b=null;renderOurs()};
$("#o").addEventListener("scroll",()=>requestAnimationFrame(syncFromO),{passive:true});
$("#w").addEventListener("scroll",()=>requestAnimationFrame(syncFromW),{passive:true});
$("#w").addEventListener("click",e=>{const r=e.target.closest(".wr.s");if(!r)return;const i=S.P.st.findIndex(s=>s.w===+r.dataset.r);if(i>=0)goto(i)});
addEventListener("resize",()=>measure());
function start(){if(matchMedia("(min-width:761px)").matches)$("#wp").dataset.off="0";setLine(0)}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>measure());
start();
</script>
